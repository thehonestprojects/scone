[workspace]
resolver = "3"
members = [
    "crates/scone",
    "crates/scone-blockchain",
    "crates/scone-core",
    "crates/scone-crypto",
    "crates/scone-keystore",
    "crates/scone-protocol",
    "crates/scone-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
blake3 = "1"
thiserror = "2"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
argon2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
rpassword = "7"
tempfile = "3"
scone-blockchain = { path = "crates/scone-blockchain" }
scone-core = { path = "crates/scone-core" }
scone-crypto = { path = "crates/scone-crypto" }
scone-keystore = { path = "crates/scone-keystore" }
scone-protocol = { path = "crates/scone-protocol" }
scone-storage = { path = "crates/scone-storage" }
